<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TagExplorer Smoke Tests</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:Inter,system-ui,sans-serif;background:#0c0b16;color:#fff;padding:1rem}
    .log{white-space:pre-wrap;background:#071022;padding:1rem;border-radius:8px;margin-top:1rem}
    button{padding:.5rem 1rem;border-radius:8px;border:1px solid #333;background:#111;color:#fff}
  </style>
</head>
<body>
  <h1>TagExplorer - Smoke Test</h1>
  <p>Run small smoke checks for fetchArtistImages and setBestImage (browser-only).</p>
  <div>
    <label>Artist name: <input id="artistName" value="sakimichan" /></label>
    <button id="runFetch">Run fetchArtistImages</button>
    <button id="runSetBest">Run setBestImage test</button>
  </div>
  <div id="results" class="log"></div>

  <script type="module">
    const out = (s) => document.getElementById('results').textContent += s + '\n';

    document.getElementById('runFetch').addEventListener('click', async () => {
      const name = document.getElementById('artistName').value.trim();
      out('Fetching artist images for: ' + name);
      try {
        const api = await import('../modules/api.js');
        const res = await api.fetchArtistImages(name, [], { limit: 20, page: 1, useCache: false });
        out('fetchArtistImages -> got ' + (Array.isArray(res) ? res.length : 0) + ' posts');
        if (Array.isArray(res) && res.length > 0) {
          out('Sample post preview url: ' + (res[0].preview_file_url || res[0].large_file_url || res[0].file_url));
        }
      } catch (e) {
        out('fetchArtistImages failed: ' + String(e));
      }
    });

    document.getElementById('runSetBest').addEventListener('click', async () => {
      const name = document.getElementById('artistName').value.trim();
      out('Testing setBestImage for: ' + name);
      try {
        const gallery = await import('../modules/gallery.js');
        // create an img in the DOM and use test helper
        const img = document.createElement('img');
        img.style.width = '200px';
        img.style.height = '300px';
        img.style.display = 'block';
        img.alt = 'smoke-test';
        document.body.appendChild(img);
        const artist = { artistName: name };
        gallery._test_setBestImage(artist, img);
        out('setBestImage invoked; observe img.src change or console for errors.');
      } catch (e) {
        out('setBestImage failed: ' + String(e));
      }
    });
  </script>
</body>
</html>
