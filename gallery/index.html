<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TagExplorer · Artist Gallery</title>
  <meta name="description" content="Discover NSFW artists on Danbooru with whispered humiliation-driven tag filters.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Parisienne&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="relative min-h-screen overflow-x-hidden fem-theme" data-page="gallery">
  <div id="background-blur" class="background-lattice" aria-hidden="true"></div>
  <div class="relative z-10 flex min-h-screen flex-col" data-shell>
    <header class="app-bar" data-app-bar>
      <div class="app-bar__row">
        <div class="app-bar__brand">
          <a class="tag-explorer-wordmark app-bar__wordmark" href="./" data-router-link>TagExplorer</a>
          <p id="tagline" class="app-bar__tagline">Pathetic..~</p>
        </div>
        <label class="app-search" for="artist-name-filter">
          <span class="sr-only">Search artists by name</span>
          <svg class="app-search__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.06l4.24 4.24-1.4 1.4-4.24-4.24A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z" fill="currentColor"/></svg>
          <input id="artist-name-filter" class="app-search__input" type="search" placeholder="Search artists…" autocomplete="off" spellcheck="false" enterkeyhint="search">
          <kbd class="app-search__kbd" aria-hidden="true">/</kbd>
        </label>
        <nav class="app-bar__nav" aria-label="Primary">
          <a href="./" class="app-bar__link is-active" aria-current="page" data-router-link>Gallery</a>
          <a href="../about/" class="app-bar__link" data-router-link>About</a>
          <a href="../data/" class="app-bar__link" data-router-link>Data</a>
        </nav>
      </div>
      <te-command-bar></te-command-bar>
    </header>

    <button id="back-to-top" class="control-btn command-btn command-btn--ghost" type="button" aria-label="Back to top">TOP</button>

    <div class="gallery-layout" data-gallery-layout>
      <main class="relative z-10 flex-1 min-w-0" data-gallery-main>
        <div class="gallery-shell">
          <section class="gallery-results" aria-label="Results">
            <div class="gallery-results__bar">
              <div id="filtered-results" aria-live="polite" aria-label="Search results summary" class="results-banner"></div>
              <button id="clear-tags" class="browse-btn gallery-results__clear" type="button" style="display: none;">Clear tags</button>
              <label class="results-sort">
                <span>Sort</span>
                <select id="results-sort">
                  <option value="name">Name (A–Z)</option>
                  <option value="count">Most posts</option>
                  <option value="tag-frequency">Best tag match</option>
                  <option value="shuffle">Shuffle</option>
                </select>
              </label>
            </div>
            <section id="artist-gallery" aria-label="Artist gallery" role="region" class="gallery-grid"></section>
          </section>
        </div>
      </main>
      <te-pinned-sidebar></te-pinned-sidebar>
    </div>
  </div>

  <div id="tag-filter-popover" class="tag-explorer-sidebar" aria-hidden="true"></div>
  <div id="jrpg-bubbles" aria-live="polite" aria-label="Tag notifications"></div>
  <div
    id="ritual-overlay-host"
    class="ritual-overlay-host"
    aria-live="polite"
    aria-relevant="additions removals"
  ></div>
  <te-audio-panel data-src-prefix="../"></te-audio-panel>
  <script type="module" src="../main.js"></script>
</body>
</html>
