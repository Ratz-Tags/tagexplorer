name: Update Danbooru data

# Refreshes artists.json / kink-tags.json from Danbooru, commits the result to
# the branch it ran on, and redeploys GitHub Pages so the live site picks it up.
# Optional secrets DANBOORU_LOGIN + DANBOORU_API_KEY authenticate the requests.

on:
  schedule:
    - cron: '23 2 * * *'   # daily: refresh post counts
    - cron: '41 4 * * 0'   # weekly (Sun): re-check tags, discover new artists, refresh counts
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to refresh'
        type: choice
        options:
          - full
          - counts
        default: full
  pull_request:
    paths:
      - 'scripts/**'
      - 'modules/tag-categories.js'
      - '.github/workflows/update-data.yml'

permissions:
  contents: read

jobs:
  access-check:
    # PRs only: proves the updaters can still reach Danbooru from Actions. Never commits.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check Danbooru API access
        run: node scripts/check-danbooru.js
        env:
          DANBOORU_LOGIN: ${{ secrets.DANBOORU_LOGIN }}
          DANBOORU_API_KEY: ${{ secrets.DANBOORU_API_KEY }}

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write   # push the data commit
      actions: write    # dispatch the Pages deploy
    concurrency:
      group: update-data-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      DANBOORU_LOGIN: ${{ secrets.DANBOORU_LOGIN }}
      DANBOORU_API_KEY: ${{ secrets.DANBOORU_API_KEY }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '41 4 * * 0' && 'full' || 'counts') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check Danbooru API access
        run: node scripts/check-danbooru.js

      - name: Re-check tags and discover artists
        if: env.MODE == 'full'
        run: node scripts/updateKinkTags.js

      - name: Refresh post counts
        run: node scripts/updateCounts.js

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artists.json kink-tags.json
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update Danbooru data (${MODE}) [skip ci]"
          pushed=false
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=true
              break
            fi
            sleep $((attempt * 15))
          done
          echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
          if [ "$pushed" != true ]; then
            echo "::error::Could not push the data commit to $GITHUB_REF_NAME"
            exit 1
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so the
      # Pages deploy has to be started explicitly.
      - name: Redeploy GitHub Pages
        if: steps.commit.outputs.pushed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "$GITHUB_REF_NAME"
