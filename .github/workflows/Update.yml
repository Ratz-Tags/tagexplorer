name: Update kink-tags.json

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC

permissions:
  contents: write  # allow committing changes
  pull-requests: write  # allow creating PRs

concurrency:
  group: update-kink-tags
  cancel-in-progress: false

jobs:
  update-kink-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Allow up to 2 hours for the script to run
    steps:
      - name: Checkout Holding branch
        uses: actions/checkout@v4
        with:
          ref: Holding
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install || echo "No dependencies needed"

      - name: Run tag updater
        run: node scripts/updateKinkTags.js
        continue-on-error: true  # Don't fail the workflow if script errors

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/kink-tags-auto
          title: 'chore: auto-update kink-tags.json'
          body: |
            Automated update of kink-tags.json and artists.json
            
            This PR was created automatically by the scheduled workflow.
            Review the changes and merge when ready.
            
            **Note:** This update may take time to process. The PR will be updated if the workflow runs again.
          commit-message: 'chore: update kink-tags.json [skip ci]'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          delete-branch: true
          labels: |
            automated
            data-update
