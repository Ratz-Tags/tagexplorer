name: Update artists.json with post counts

on:
  workflow_dispatch:
  push:
    branches:
      - Holding
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-artists-json
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Holding branch
        uses: actions/checkout@v4
        with:
          ref: Holding
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install || echo "No dependencies"

      - name: Run update script
        run: node update-json.js

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add artists.json
          git commit -m "chore: auto-update artists.json [skip ci]" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push origin HEAD:Holding
