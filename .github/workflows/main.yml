name: Update artists.json with post counts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Holding branch
        run: |
          git fetch origin Holding || true
          if git show-ref --quiet refs/remotes/origin/Holding; then
            git checkout Holding
            git reset --hard origin/Holding
          else
            git checkout -b Holding
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install || echo "No dependencies"

      - name: Run update script
        run: node update-json.js

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add artists.json
          git commit -m "Auto-update artists.json [skip ci]" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push origin HEAD:Holding
