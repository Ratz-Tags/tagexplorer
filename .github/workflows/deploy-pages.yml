name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'artists.json'
      - 'kink-tags.json'
      - '.github/workflows/main.yml'
      - '.github/workflows/Update.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Inject OpenRouter API Key
        run: |
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            cat > openrouter-api.local.js << 'EOF'
          /**
           * OpenRouter API Configuration (Injected via GitHub Actions)
           * This file is generated during deployment
           */
          if (typeof window !== 'undefined') {
            window._openRouterApiKey = '${{ secrets.OPENROUTER_API_KEY }}';
          }
          EOF
          else
            echo "Warning: OPENROUTER_API_KEY secret not set"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

