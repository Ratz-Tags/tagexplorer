<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TagExplorer · Artist Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="description" content="Dive into a single Danbooru artist with whispered taunts and curated tag metadata.">
  <link rel="icon" type="image/png" href="../../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Parisienne&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
</head>
<body class="artist-body" data-page="artist">
  <div class="artist-background" aria-hidden="true"></div>
  <div class="artist-shell" data-shell>
    <header class="artist-header">
      <a class="tag-explorer-wordmark" href="../../gallery/" data-router-link>TagExplorer</a>
      <nav class="artist-nav" aria-label="Primary">
        <a href="../../gallery/" class="artist-link" data-router-link>Gallery</a>
        <a href="../../about/" class="artist-link" data-router-link>About</a>
        <a href="../../data/" class="artist-link" data-router-link>Data</a>
      </nav>
    </header>
    <main class="artist-main" aria-live="polite" data-artist-root>
      <section class="artist-meta" data-artist-meta>
        <h1 class="artist-title" data-artist-name>Loading artist…</h1>
        <p class="artist-subtitle" data-artist-tagline>Wait while we fetch the proof of what you really wanted.</p>
        <div class="artist-actions">
          <a class="artist-back" href="../../gallery/" data-router-link>&larr; Back to gallery</a>
          <button class="artist-favorite" data-artist-favorite type="button">Add to favorites</button>
        </div>
      </section>
      <section class="artist-preview" data-artist-preview aria-label="Artist preview"></section>
      <section class="artist-tags" data-artist-tags aria-label="Artist tags"></section>
      <section class="artist-links" data-artist-links aria-label="Artist links"></section>
    </main>
  </div>
  <te-audio-panel data-src-prefix="../../"></te-audio-panel>
  <script type="module" src="../../main.js"></script>
</body>
</html>
