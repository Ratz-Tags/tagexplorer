<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sticky Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="relative min-h-screen overflow-x-hidden">
  <div class="relative z-10 flex min-h-screen flex-col">
    <header class="top-surface">
      <div class="top-band">
        <h1>Header Content</h1>
        <p>This header content should scroll normally</p>
      </div>
    </header>

    <div class="surface-divider"></div>

    <div class="command-bar-shell" role="presentation">
      <nav class="command-bar">
        <div class="command-group">
          <button class="control-btn command-btn">STICKY TEST</button>
          <button class="control-btn command-btn">SHOULD STICK</button>
        </div>
      </nav>
    </div>

    <main class="relative z-10 flex-1">
      <div style="height: 200vh; padding: 2rem; background: rgba(0,0,0,0.5);">
        <h2 style="color: white; margin-bottom: 2rem;">Scroll Test Content</h2>
        <p style="color: #ccc; margin-bottom: 1rem;">The command bar above should stick to the top when you scroll.</p>
        <p style="color: #ccc; margin-bottom: 1rem;">This content is tall enough to force scrolling.</p>
        <p style="color: #ccc; margin-bottom: 1rem;">Keep scrolling to test the sticky behavior...</p>
        <div style="height: 100vh; background: linear-gradient(to bottom, rgba(255,100,212,0.1), rgba(102,243,255,0.1)); margin: 2rem 0;"></div>
        <p style="color: #ccc;">Bottom of test content</p>
      </div>
    </main>
  </div>
</body>
</html>
